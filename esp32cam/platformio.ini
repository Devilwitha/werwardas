; Firmware für die ESP32-CAM (AI-Thinker): liefert unter http://<IP>/capture ein JPEG.
; WLAN-Zugangsdaten stehen in include/secrets.h (Vorlage: include/secrets.example.h).
;
; Bauen und flashen:  pio run -t upload --upload-port COM41
; Danach Updates per WLAN:  pio run -e ota -t upload --upload-port werwardas-cam.local

[env:esp32cam]
platform = espressif32@6.9.0
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = min_spiffs.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

[env:ota]
extends = env:esp32cam
upload_protocol = espota
upload_flags = --auth=werwardas  ; = OTA_PASSWORD aus secrets.h
