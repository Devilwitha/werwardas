name: Windows-App bauen

# Jeder Push auf main, der die Windows-App ändert, erzeugt ein Release mit der fertigen WerWarDas.exe.
# Die installierte App sucht regelmäßig nach diesem Release und aktualisiert sich selbst.
on:
  push:
    branches: [main]
    paths: ["windows/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Version festlegen
        id: version
        shell: pwsh
        run: |
          # Fortlaufende Nummer, damit jede neue Version größer ist als die vorige
          "version=1.0.${{ github.run_number }}" >> $env:GITHUB_OUTPUT

      - name: Exe bauen (eine Datei, ohne .NET-Installation lauffähig)
        run: >
          dotnet publish windows/WerWarDas/WerWarDas.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:Version=${{ steps.version.outputs.version }}
          -o out

      - uses: actions/upload-artifact@v4
        with:
          name: WerWarDas-windows
          path: out/WerWarDas.exe

      - name: Release erstellen
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.version.outputs.version }}"
          gh release create "v$v" out/WerWarDas.exe `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title "WerWarDas $v" `
            --generate-notes `
            --latest
