blueprint:
  name: WerWarDas – Aufräum-Streak
  description: >
    Zählt die Tage in Folge, an denen das Zimmer nie unordentlich war ("Streak"), und merkt sich den
    Rekord. Braucht vorher drei Helfer (Einstellungen -> Geräte & Dienste -> Helfer -> Hinzufügen):
    zwei Zähler ("Streak" und "Rekord") und einen Schalter ("War heute schon unordentlich").
  domain: automation
  source_url: https://github.com/Devilwitha/werwardas/blob/main/homeassistant/blueprints/automation/werwardas/aufraeum_streak.yaml
  input:
    messy_sensor:
      name: Unordentlich-Sensor
      description: binary_sensor "Unordentlich" der WerWarDas Kamera
      selector:
        entity:
          domain: binary_sensor
    daily_flag:
      name: Helfer "War heute schon unordentlich"
      description: input_boolean-Helfer, merkt sich für den laufenden Tag, ob es schon mal unordentlich war
      selector:
        entity:
          domain: input_boolean
    streak_counter:
      name: Helfer "Streak"
      description: counter-Helfer mit der aktuellen Anzahl Tage in Folge aufgeräumt
      selector:
        entity:
          domain: counter
    record_counter:
      name: Helfer "Rekord"
      description: counter-Helfer mit dem bisher längsten Streak
      selector:
        entity:
          domain: counter
    reset_time:
      name: Tageswechsel
      description: Uhrzeit, zu der ein Tag gewertet und der nächste begonnen wird
      default: "00:00:00"
      selector:
        time:

mode: queued

variables:
  daily_flag: !input daily_flag
  streak_counter: !input streak_counter
  record_counter: !input record_counter

trigger:
  - platform: state
    entity_id: !input messy_sensor
    to: "on"
    id: messy
  - platform: time
    at: !input reset_time
    id: rollover

action:
  - choose:
      - conditions:
          - condition: trigger
            id: messy
        sequence:
          - service: input_boolean.turn_on
            target:
              entity_id: !input daily_flag
      - conditions:
          - condition: trigger
            id: rollover
        sequence:
          - if:
              - condition: state
                entity_id: !input daily_flag
                state: "off"
            then:
              # Der ganze Tag war aufgeräumt -> Streak zählt weiter.
              - service: counter.increment
                target:
                  entity_id: !input streak_counter
              - if:
                  - "{{ states(streak_counter) | int(0) > states(record_counter) | int(0) }}"
                then:
                  - service: counter.set_value
                    target:
                      entity_id: !input record_counter
                    data:
                      value: "{{ states(streak_counter) | int(0) }}"
            else:
              # Zwischendurch unordentlich -> Streak reißt ab.
              - service: counter.reset
                target:
                  entity_id: !input streak_counter
          - service: input_boolean.turn_off
            target:
              entity_id: !input daily_flag
